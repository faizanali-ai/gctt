[project]
name = "gctt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django==5.2.*",
    "django-otp>=1.7.5",
    "django-ratelimit==4.*",
    "django-storages[boto3]>=1.14.6",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "sentry-sdk>=2.75.0",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pip-audit>=2.7",
    "ruff>=0.17.5",
]

[tool.ruff]
exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Django's Meta/admin config attributes are intentionally mutable class attrs
ignore = ["RUF012"]
