<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none" class="gctt-brand-logo">
  <defs>
    <linearGradient id="gctt-sapphire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Architectural Tekton Pillar Emblem (Sapphire & Cobalt) -->
  <g transform="translate(6, 8)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#0B132B" stroke="#2563EB" stroke-width="2"/>
    <path d="M12 16 H36 M24 16 V36 M16 24 H32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="34" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- High-Contrast Wordmark -->
  <g transform="translate(68, 14)">
    <!-- Primary Acronym: GCTT (Stark Navy Vector) -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.08em" fill="#000e27">
      GCTT
    </text>

    <!-- Cobalt Accent Dot -->
    <circle cx="96" cy="18" r="3" fill="#006398" />

    <!-- Subtitle: Crisp High-Contrast Steel Blue -->
    <text x="0" y="40" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.18em" text-transform="uppercase" fill="#006398">
      GLOBAL CENTER FOR TECH &amp; TRAINING · TEXAS
    </text>
  </g>
</svg>