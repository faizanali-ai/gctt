name: Production Keepalive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier 15-minute sleep timeout
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Keepalive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Wake Endpoint
        run: |
          set -euo pipefail
          echo "Pinging https://gctekton.com/wake/ to keep the instance awake..."
          RESPONSE=$(curl --silent --show-error --fail --max-time 20 \
            --retry 2 --retry-delay 5 \
            -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" \
            "https://gctekton.com/wake/")
          echo "$RESPONSE"
          if ! echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "::error::Keepalive failed: /wake/ did not return HTTP 200."
            exit 1
          fi
          echo "Service is awake (database not touched)."
