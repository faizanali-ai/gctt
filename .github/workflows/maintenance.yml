name: Production maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Type "apply" to run destructive retention and pending cleanup.
        required: false
        default: ""

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
      SUPABASE_REGION: ${{ secrets.SUPABASE_REGION }}
      SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_ACCESS_KEY_ID }}
      SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Stop after the legacy sunset date
        env:
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY || 'maintenance-ci-secret-9f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d7c6b5a49382' }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL || 'sqlite:///db.sqlite3' }}
        run: |
          if [ "$(date -u +%F)" \> "2027-02-19" ] || [ "$(date -u +%F)" = "2027-02-19" ]; then
            echo "Legacy sunset reached. Remove the legacy routes and this guard."
            exit 1
          fi
          uv run python manage.py check_legacy_urls
      - name: Check database credentials
        id: check_db
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::Production database credentials (PRODUCTION_DATABASE_URL / PRODUCTION_DJANGO_SECRET_KEY) are not set in GitHub Secrets. Skipping database maintenance tasks."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi
      - name: Report retention and pending records (dry run)
        if: steps.check_db.outputs.has_creds == 'true'
        run: |
          uv run python manage.py purge_retention
          uv run python manage.py purge_pending --dry-run
      - name: Purge expired OTP rows
        if: steps.check_db.outputs.has_creds == 'true'
        run: uv run python manage.py purge_email_otp
      - name: Clear expired sessions
        if: steps.check_db.outputs.has_creds == 'true'
        run: uv run python manage.py clearsessions
      - name: Verify production media storage
        if: steps.check_db.outputs.has_creds == 'true' && github.event.inputs.confirm_apply == 'apply'
        run: uv run python manage.py check_storage
      - name: Apply retention and pending cleanup
        if: steps.check_db.outputs.has_creds == 'true' && github.event.inputs.confirm_apply == 'apply'
        run: |
          uv run python manage.py purge_retention --apply
          uv run python manage.py purge_pending
