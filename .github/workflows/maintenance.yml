name: Production maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  retention:
    runs-on: ubuntu-latest
    environment: production
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Stop after the legacy sunset date
        run: |
          if [ "$(date -u +%F)" \> "2027-02-19" ] || [ "$(date -u +%F)" = "2027-02-19" ]; then
            echo "Legacy sunset reached. Remove the legacy routes and this guard."
            exit 1
          fi
      - name: Purge records past the retention window
        run: uv run python manage.py purge_retention --apply
