name: Production maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Type "apply" to run destructive retention and pending cleanup.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Warn if legacy URL sunset has passed
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: maintenance-ci-secret-9f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d7c6b5a49382
          DATABASE_URL: sqlite:///db.sqlite3
        run: |
          if [ "$(date -u +%F)" \> "2027-02-19" ] || [ "$(date -u +%F)" = "2027-02-19" ]; then
            echo "::warning::Legacy sunset reached (2027-02-19). Remove the legacy routes; continuing database maintenance."
          fi
          if ! uv run python manage.py check_legacy_urls; then
            echo "::warning::check_legacy_urls reported expired legacy routes; continuing database maintenance."
          fi
      - name: Check database credentials
        id: check_db
        env:
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::Production database credentials (PRODUCTION_DATABASE_URL / PRODUCTION_DJANGO_SECRET_KEY) are not set in GitHub Secrets. Skipping database maintenance tasks."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi
      - name: Report retention and pending records (dry run)
        if: steps.check_db.outputs.has_creds == 'true'
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
        run: |
          uv run python manage.py purge_retention
          uv run python manage.py purge_pending --dry-run
      - name: Purge expired OTP rows
        if: steps.check_db.outputs.has_creds == 'true'
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
        run: uv run python manage.py purge_email_otp
      - name: Clear expired sessions
        if: steps.check_db.outputs.has_creds == 'true'
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
        run: uv run python manage.py clearsessions

  apply_cleanup:
    name: Apply retention and pending cleanup
    needs: maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_apply == 'apply'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Check production database credentials
        env:
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "::error::Production database credentials (PRODUCTION_DATABASE_URL / PRODUCTION_DJANGO_SECRET_KEY) are not set."
            exit 1
          fi
      - name: Verify production media storage
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_REGION: ${{ secrets.SUPABASE_REGION }}
          SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_ACCESS_KEY_ID }}
          SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_SECRET_ACCESS_KEY }}
        run: uv run python manage.py check_storage
      - name: Apply retention and pending cleanup
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ${{ secrets.PRODUCTION_DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SUPABASE_REGION: ${{ secrets.SUPABASE_REGION }}
          SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_ACCESS_KEY_ID }}
          SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_SECRET_ACCESS_KEY }}
        run: |
          uv run python manage.py purge_retention --apply
          uv run python manage.py purge_pending
