{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | GCTT Admin{% endblock %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    :root {
      --primary: #0c1e36;
      --secondary: #162e4e;
      --accent: #9e6534;
      --link-fg: #0c1e36;
      --link-hover-color: #9e6534;
      --button-bg: #0c1e36;
      --button-hover-bg: #9e6534;
    }
    #header {
      background: #0c1e36;
      border-bottom: 2px solid #9e6534;
    }
    #branding h1,
    #branding h1 a:link,
    #branding h1 a:visited {
      color: #faf9f6;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      letter-spacing: 0.02em;
    }
    .module h2,
    .module caption,
    .inline-group h2 {
      background: #0c1e36;
    }
  </style>
{% endblock %}

{% block branding %}
  <div id="site-name">
    <a href="{% url 'admin:index' %}">GCTT Corporate Administration</a>
  </div>
{% endblock %}
