<form method="post" action="{% url 'submit_enquiry' %}" class="space-y-5">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.resolver_match.url_name }}">
  {{ enquiry_form.website }}
  {% for field in enquiry_form.visible_fields %}
    <label class="block">
      <span class="mb-1.5 block font-mono text-2xs font-bold uppercase tracking-wider text-[#000e27]">{{ field.label }}</span>
      {{ field }}
      {% if field.errors %}<span class="mt-1.5 block font-mono text-xs font-semibold text-rose-600">{{ field.errors.0 }}</span>{% endif %}
    </label>
  {% endfor %}
  <button type="submit" class="btn-stitch-primary w-full py-3.5 font-mono text-xs uppercase tracking-wider font-bold justify-center">Transmit Inquiry &rarr;</button>
</form>
