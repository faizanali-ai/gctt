{% if form.errors %}
  <div class="alert alert-danger" role="alert" tabindex="-1" data-form-errors>
    <div>
      <p class="font-semibold">Please correct the following:</p>
      {% if form.non_field_errors %}
        <p class="mt-2">{{ form.non_field_errors.0 }}</p>
      {% endif %}
      <ul class="mt-2 list-disc space-y-1 pl-5">
        {% for field in form %}
          {% if field.errors %}
            <li><a href="#{{ field.id_for_label }}" class="underline">{{ field.label }}</a>: {{ field.errors.0 }}</li>
          {% endif %}
        {% endfor %}
      </ul>
    </div>
  </div>
{% endif %}
