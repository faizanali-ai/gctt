<!-- Inner Page Hero Component (Stitch Theme) -->
<section class="border-b border-[#dde9ff] bg-[#f8f9ff] py-16 px-6 font-sans">
  <div class="mx-auto max-w-5xl text-center space-y-4">
    {% if eyebrow %}
      <div class="inline-flex items-center gap-2 rounded-full border border-[#dde9ff] bg-white px-4 py-1 text-xs font-mono font-semibold uppercase text-[#006398] shadow-2xs">
        <span class="h-2 w-2 rounded-full bg-[#006398]"></span>
        <span>{{ eyebrow }}</span>
      </div>
    {% endif %}

    <h1 class="font-display text-3xl sm:text-5xl font-bold tracking-tight text-[#000e27] leading-tight">
      {{ title }}
    </h1>

    {% if subtitle %}
      <p class="mx-auto max-w-2xl text-base sm:text-lg text-[#44474e] leading-relaxed">
        {{ subtitle }}
      </p>
    {% endif %}
  </div>
</section>
