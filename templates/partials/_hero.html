<section class="border-b border-line bg-brand text-paper">
  <div class="mx-auto max-w-6xl px-6 py-16 md:py-24">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-paper/60">{{ eyebrow }}</p>
    <h1 class="mt-4 max-w-3xl font-display text-4xl leading-[1.05] md:text-6xl">{{ title }}</h1>
    {% if intro %}<p class="mt-5 max-w-2xl text-lg text-paper/75 md:text-xl">{{ intro }}</p>{% endif %}
  </div>
</section>
