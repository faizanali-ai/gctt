<section class="relative overflow-hidden border-b-2 border-black bg-[#ffe17c] py-14 lg:py-20 font-sans">
  <!-- Neo-Brutalist 28px dot pattern overlay -->
  <div class="pointer-events-none absolute inset-0 bg-dot-pattern opacity-10"></div>

  <div class="relative z-10 mx-auto max-w-7xl px-6">
    <div class="max-w-4xl reveal">
      {% if eyebrow %}
        <div class="inline-flex items-center gap-2 rounded-full border-2 border-black bg-white px-4 py-1 font-mono text-[11px] font-bold uppercase tracking-wider text-black shadow-[2px_2px_0px_#000000]">
          <span class="h-2 w-2 rounded-full bg-black"></span>
          <span>{{ eyebrow }}</span>
        </div>
      {% endif %}
      <h1 class="mt-4 font-display text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight text-black leading-tight">
        {{ title }}
      </h1>
      {% if intro %}
        <p class="mt-3 font-sans text-sm sm:text-base leading-relaxed text-black/80 max-w-2xl font-medium">
          {{ intro }}
        </p>
      {% endif %}
    </div>
  </div>
</section>
