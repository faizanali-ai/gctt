<section class="bg-atmospheric-dark relative overflow-hidden border-b border-white/10 py-16 lg:py-22">
  <!-- Grid overlay and ambient glow -->
  <div class="absolute inset-0 grid-overlay opacity-40 pointer-events-none"></div>
  <div class="absolute -top-24 left-1/2 -translate-x-1/2 h-72 w-96 rounded-full bg-indigo-500/15 blur-3xl pointer-events-none"></div>

  <div class="relative mx-auto max-w-7xl px-6 z-10">
    <div class="max-w-3xl reveal">
      {% if eyebrow %}
        <div class="inline-flex items-center gap-2 rounded-full glass-soft px-3.5 py-1 text-xs font-semibold text-indigo-300 shadow-xs font-display">
          <span class="h-1.5 w-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
          <span>{{ eyebrow }}</span>
        </div>
      {% endif %}
      <h1 class="mt-5 text-3xl font-bold tracking-tight text-white sm:text-4xl lg:text-5xl font-serif leading-[1.1]">
        {{ title }}
      </h1>
      {% if intro %}
        <p class="mt-4 text-base leading-relaxed text-slate-300 sm:text-lg font-sans">
          {{ intro }}
        </p>
      {% endif %}
    </div>
  </div>
</section>
