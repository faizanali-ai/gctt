<section class="kani-hero-bg relative overflow-hidden border-b border-line py-16 lg:py-20">
  <!-- Ambient Glow Orb -->
  <div class="ambient-glow-orb -top-24 -left-24 h-72 w-72 bg-blue-600/15 dark:bg-blue-600/10"></div>
  <div class="ambient-glow-orb -bottom-24 -right-24 h-72 w-72 bg-sky-400/15 dark:bg-sky-500/10"></div>

  <!-- Subtle Architectural Grid Background -->
  <div class="pointer-events-none absolute inset-0 bg-[linear-gradient(to_right,rgba(37,99,235,0.04)_1px,transparent_1px),linear-gradient(to_bottom,rgba(37,99,235,0.04)_1px,transparent_1px)] bg-[size:32px_32px]"></div>

  <div class="relative mx-auto max-w-7xl px-6">
    <div class="max-w-3xl reveal">
      {% if eyebrow %}
        <div class="inline-flex items-center gap-2 rounded-full border border-blue-500/25 bg-blue-500/10 px-3.5 py-1 text-xs font-semibold text-blue-700 dark:text-blue-300 backdrop-blur-xs">
          <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></span>
          <span>{{ eyebrow }}</span>
        </div>
      {% endif %}
      <h1 class="mt-4 text-3xl font-extrabold tracking-tight text-ink sm:text-4xl lg:text-5xl font-display leading-[1.15]">
        {{ title }}
      </h1>
      {% if intro %}
        <p class="mt-4 text-base leading-relaxed text-ink-muted sm:text-lg font-sans">
          {{ intro }}
        </p>
      {% endif %}
    </div>
  </div>
</section>
