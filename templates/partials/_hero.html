{% load static %}
<section class="relative isolate overflow-hidden border-b border-line bg-canvas">
  <div class="pointer-events-none absolute inset-0 text-ink opacity-60 sm:opacity-100" aria-hidden="true">
    {% include "partials/_geometry.html" %}
  </div>
  <div class="container-site relative py-16 sm:py-20 md:py-24">
    <div class="max-w-3xl">
      {% if eyebrow %}
        <p class="eyebrow eyebrow-accent">{{ eyebrow }}</p>
      {% endif %}
      <h1 class="mt-3 font-display text-h1 font-semibold sm:text-display-2">{{ title }}</h1>
      {% if subtitle %}
        <p class="mt-4 max-w-2xl text-body-lg text-muted">{{ subtitle }}</p>
      {% elif intro %}
        <p class="mt-4 max-w-2xl text-body-lg text-muted">{{ intro }}</p>
      {% endif %}
      {% if cta_label and cta_url %}
        <div class="mt-7">
          <a href="{{ cta_url }}" class="btn btn-primary">
            {{ cta_label }}
            <svg aria-hidden="true"><use href="{% static 'images/icons.svg' %}#arrow-right"></use></svg>
          </a>
        </div>
      {% endif %}
    </div>
  </div>
</section>
