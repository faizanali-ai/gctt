<!-- Inner Page Hero Component (Original Clean Navy Banner) -->
<section class="bg-[#000e27] text-white font-sans py-16 md:py-20 border-b border-[#0f2444]">
  <div class="container-site">
    {% if eyebrow %}
      <p class="text-xs font-bold uppercase tracking-widest text-[#5bb8fe]">{{ eyebrow }}</p>
    {% endif %}

    <h1 class="mt-3 max-w-3xl font-display text-3xl font-bold leading-tight sm:text-4xl md:text-5xl text-white">
      {{ title }}
    </h1>

    {% if subtitle %}
      <p class="mt-4 max-w-2xl text-base sm:text-lg text-[#c5c6cf] leading-relaxed">
        {{ subtitle }}
      </p>
    {% elif intro %}
      <p class="mt-4 max-w-2xl text-base sm:text-lg text-[#c5c6cf] leading-relaxed">
        {{ intro }}
      </p>
    {% endif %}
  </div>
</section>
