{% if errors %}
  <div class="alert alert-danger" role="alert" tabindex="-1" data-form-errors>
    <div>
      <p class="font-semibold">Please correct the following:</p>
      <ul class="mt-2 list-disc space-y-1 pl-5">
        {% for error in errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    </div>
  </div>
{% endif %}
