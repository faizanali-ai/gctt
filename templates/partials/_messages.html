{% load static %}
{% if messages %}
  <div class="toast-stack" aria-live="polite" aria-atomic="false">
    {% for message in messages %}
      <div class="toast {% if message.tags == 'success' %}toast-success{% elif message.tags == 'error' %}toast-danger{% elif message.tags == 'warning' %}toast-warning{% endif %}"
           role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}"
           {% if message.tags == 'success' %}data-autodismiss="6000"{% endif %}>
        <p class="flex-1">{{ message }}</p>
        <button type="button" class="btn btn-ghost btn-sm" data-toast-dismiss aria-label="Dismiss notification">
          <svg class="h-4 w-4" aria-hidden="true"><use href="{% static 'images/icons.svg' %}#close"></use></svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
