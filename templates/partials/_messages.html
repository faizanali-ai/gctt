{% if messages %}
  <div class="mx-auto max-w-7xl space-y-2 px-6 pt-4">
    {% for message in messages %}
      <p class="rounded-md border px-4 py-3 text-sm {% if message.tags == 'success' %}border-brand/25 bg-surface text-brand{% else %}border-accent/30 bg-accent/5 text-accent{% endif %}">
        {{ message }}
      </p>
    {% endfor %}
  </div>
{% endif %}
