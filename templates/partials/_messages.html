{% if messages %}
  <div class="mx-auto max-w-6xl space-y-2 px-6 pt-4">
    {% for message in messages %}
      <p class="rounded-sm border px-4 py-3 text-sm {% if message.tags == 'success' %}border-brand/30 bg-brand/5 text-brand{% else %}border-accent/40 bg-accent/5 text-accent{% endif %}">
        {{ message }}
      </p>
    {% endfor %}
  </div>
{% endif %}
