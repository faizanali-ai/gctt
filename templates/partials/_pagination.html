{% if page_obj.paginator.num_pages > 1 %}
  <nav class="mt-8 flex items-center justify-between border-t border-line-subtle pt-4 text-xs font-semibold" aria-label="Pagination">
    <div>
      {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" class="btn btn-secondary text-2xs py-1.5 px-3">
          ← Previous
        </a>
      {% endif %}
    </div>
    <span class="text-ink-subtle">
      Page <span class="font-bold text-ink">{{ page_obj.number }}</span> of {{ page_obj.paginator.num_pages }}
    </span>
    <div>
      {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" class="btn btn-secondary text-2xs py-1.5 px-3">
          Next →
        </a>
      {% endif %}
    </div>
  </nav>
{% endif %}
