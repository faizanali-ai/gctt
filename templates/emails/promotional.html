<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#faf9f7;color:#14161a;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf9f7;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e2ded6;border-radius:10px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px;border-bottom:4px solid #a84a06;">
              <p style="margin:0 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#a84a06;">{{ company.name }}</p>
              <h1 style="margin:0;font-size:26px;line-height:1.2;">News from {{ company.name }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px;font-size:15px;line-height:1.6;">
              {{ content|linebreaks }}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#f2efe9;color:#6b7078;font-size:12px;line-height:1.6;">
              You are receiving this because you opted in to {{ company.name }} offers and programme news.<br>
              {{ company.legal_name }} · {{ company.address }} · <a href="mailto:{{ company.email }}" style="color:#a84a06;">{{ company.email }}</a><br>
              <a href="{{ unsubscribe_url }}" style="color:#4a4f57;">Unsubscribe from promotional emails</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
