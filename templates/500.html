{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Service unavailable — GCTT</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'images/logo-icon-512.png' %}">
  <link rel="preload" href="{% static 'fonts/inter.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/output.css' %}?v=20261121">
</head>
<body class="flex min-h-screen flex-col items-center justify-center bg-canvas px-5 py-16 text-ink antialiased">
  <main class="mx-auto w-full max-w-lg text-center">
    <a href="/" class="inline-flex items-center rounded-md bg-white px-2 py-1" aria-label="GCTT home">
      <img src="{% static 'images/logo-main.png' %}" alt="GCTT" width="520" height="176" class="h-9 w-auto">
    </a>

    <p class="mt-10 font-mono text-2xs uppercase tracking-[0.14em] text-accent">Error 500</p>
    <h1 class="mt-3 text-h1">Service unavailable.</h1>
    <p class="mt-4 text-sm leading-relaxed text-muted">
      An unexpected error interrupted this request. Please try again in a moment, or contact our team if the problem continues.
    </p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <a href="/" class="btn btn-primary">Return home</a>
      <a href="mailto:accounts@gctekton.com" class="btn btn-secondary">Contact support</a>
    </div>
  </main>
</body>
</html>
