{% extends "base.html" %}
{% block title %}Email Sign-In Code — GCTT{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-6 py-16 md:py-24 font-sans">
  <div class="text-center reveal">
    <span class="inline-flex items-center gap-1.5 rounded-full bg-[#006398]/10 px-3 py-1 font-mono text-2xs font-bold uppercase tracking-wider text-[#006398] border border-[#006398]/20">
      Passwordless Access
    </span>
    <h1 class="mt-3 font-display text-3xl font-bold text-[#000e27] sm:text-4xl">Email Sign-In Code</h1>
    <p class="mt-2 text-xs leading-relaxed text-[#44474e]">
      Enter your account email and we will send a one-time code.
    </p>
  </div>

  <div class="stitch-card mt-8 rounded-2xl border border-[#dde9ff] bg-white p-6 shadow-sm md:p-8 reveal delay-1">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="id_email" class="block text-2xs font-semibold uppercase tracking-wider text-[#0d1c2f] font-mono">
          Email address
        </label>
        <input id="id_email" name="email" type="email" autocomplete="email" required
               class="mt-1.5 w-full rounded-xl border border-[#dde9ff] bg-[#f8f9ff] px-4 py-2.5 text-[#0d1c2f] placeholder-[#525660] focus:border-[#006398] focus:bg-white focus:outline-hidden font-sans"
               placeholder="name@example.com">
      </div>
      <button type="submit" class="btn-stitch-primary mt-2 w-full justify-center">
        Send Sign-In Code
      </button>
    </form>
    <p class="mt-5 text-center text-xs text-[#44474e] font-mono">
      <a href="{% url 'login' %}" class="font-semibold text-[#006398] hover:underline">Use password instead</a>
    </p>
  </div>
</section>
{% endblock %}
