{% extends "base.html" %}
{% block title %}Password Updated — GCTT Portal{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-6 py-16 md:py-24 text-center reveal">
  <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <h1 class="mt-4 font-display text-2xl font-bold text-ink sm:text-3xl">Password Successfully Updated</h1>
  <p class="mt-3 text-xs leading-relaxed text-ink-muted">
    Your account password has been updated. You may now sign in using your updated credentials.
  </p>
  <div class="mt-8">
    <a href="{% url 'login' %}" class="btn btn-primary text-xs">
      Sign In to Portal →
    </a>
  </div>
</section>
{% endblock %}
