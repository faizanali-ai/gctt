{% extends "base.html" %}
{% block title %}Reset your password — GCTT{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-6 py-16 md:py-24">
  <h1 class="font-display text-3xl">Reset your password</h1>
  <p class="mt-2 text-ink/70">Enter your email address and we'll send you a link to set a new password.</p>
  <form method="post" class="mt-8 space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <label class="block">
        <span class="mb-1 block text-sm font-medium">{{ field.label }}</span>
        {{ field }}
        {% if field.errors %}<span class="mt-1 block text-sm text-accent">{{ field.errors.0 }}</span>{% endif %}
      </label>
    {% endfor %}
    <button type="submit" class="w-full rounded-sm bg-accent px-6 py-3 font-semibold text-paper transition hover:bg-brand">Send reset link</button>
  </form>
</section>
{% endblock %}
