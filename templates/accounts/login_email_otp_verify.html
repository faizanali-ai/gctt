{% extends "base.html" %}
{% block title %}Enter Sign-In Code — GCTT{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-6 py-16 md:py-24 font-sans">
  <div class="text-center reveal">
    <span class="inline-flex items-center gap-1.5 rounded-full bg-[#006398]/10 px-3 py-1 font-mono text-2xs font-bold uppercase tracking-wider text-[#006398] border border-[#006398]/20">
      Email Verification
    </span>
    <h1 class="mt-3 font-display text-3xl font-bold text-[#000e27] sm:text-4xl">Enter Your Code</h1>
    <p class="mt-2 text-xs leading-relaxed text-[#44474e]">
      If this email can be used, a one-time code was sent to {{ masked_email }}.
    </p>
  </div>

  <div class="stitch-card mt-8 rounded-2xl border border-[#dde9ff] bg-white p-6 shadow-sm md:p-8 reveal delay-1">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_code" class="block text-2xs font-semibold uppercase tracking-wider text-[#0d1c2f] font-mono">
          Six-digit code
        </label>
        <input id="id_code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" required
               class="mt-1.5 w-full rounded-xl border border-[#dde9ff] bg-[#f8f9ff] px-4 py-2.5 text-center font-mono text-lg tracking-[0.35em] text-[#0d1c2f] focus:border-[#006398] focus:bg-white focus:outline-hidden"
               placeholder="000000">
      </div>
      <button type="submit" class="btn-stitch-primary mt-2 w-full justify-center">
        Verify and Sign In
      </button>
    </form>

    <form method="post" action="{% url 'email_otp_resend' %}" class="mt-5 text-center">
      {% csrf_token %}
      <button type="submit" class="text-xs font-semibold text-[#006398] hover:underline font-mono">
        Send a new code
      </button>
    </form>
    <p class="mt-3 text-center text-xs text-[#44474e] font-mono">
      <a href="{% url 'email_otp_request' %}" class="hover:text-[#000e27]">Use a different email</a>
    </p>
  </div>
</section>
{% endblock %}
