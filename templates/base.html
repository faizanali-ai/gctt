{% load static %}<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ COMPANY.name }} — {{ COMPANY.legal_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ COMPANY.tagline }} IT staffing, recruitment, talent acquisition and training.{% endblock %}">
  <meta property="og:title" content="{% block og_title %}{{ COMPANY.name }} — {{ COMPANY.legal_name }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ COMPANY.tagline }} IT staffing, recruitment, talent acquisition and training.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ COMPANY.url }}{% static 'images/og-gctt-v2.jpg' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ COMPANY.url }}{% static 'images/og-gctt-v2.jpg' %}">
  <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <link rel="icon" type="image/svg+xml" href="{% static 'images/logo-icon.svg' %}">
  <link rel="alternate icon" href="{% static 'images/logo-small.webp' %}">

  <!-- Typography: Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <!-- Immediate Theme Detector (prevents theme flicker) -->
  <script>
    (function () {
      var savedTheme = localStorage.getItem("gctt-theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add("dark");
        document.documentElement.classList.remove("light");
      } else {
        document.documentElement.classList.add("light");
        document.documentElement.classList.remove("dark");
      }
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ COMPANY.name|escapejs }}",
    "legalName": "{{ COMPANY.legal_name|escapejs }}",
    "url": "{{ COMPANY.url|escapejs }}",
    "email": "{{ COMPANY.email|escapejs }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "2612 Laramie St",
      "addressLocality": "Irving",
      "addressRegion": "TX",
      "postalCode": "75062",
      "addressCountry": "US"
    }
  }
  </script>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased selection:bg-accent/15 selection:text-ink">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-brand focus:px-4 focus:py-2 focus:font-semibold focus:text-white">Skip to content</a>
  {% include "partials/_header.html" %}
  {% include "partials/_messages.html" %}
  <main id="main">{% block content %}{% endblock %}</main>
  {% include "partials/_footer.html" %}

  <!-- Scripts: Theme Mode, Mobile Drawer & Micro Motion -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Theme Controller
      function updateThemeUI() {
        var isDark = document.documentElement.classList.contains("dark");
        document.querySelectorAll(".theme-sun-icon").forEach(function (el) {
          el.classList.toggle("hidden", !isDark);
        });
        document.querySelectorAll(".theme-moon-icon").forEach(function (el) {
          el.classList.toggle("hidden", isDark);
        });
      }

      function toggleTheme() {
        var isDark = document.documentElement.classList.contains("dark");
        if (isDark) {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
          localStorage.setItem("gctt-theme", "light");
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
          localStorage.setItem("gctt-theme", "dark");
        }
        updateThemeUI();
      }

      document.querySelectorAll(".theme-toggle-btn").forEach(function (btn) {
        btn.addEventListener("click", toggleTheme);
      });
      updateThemeUI();

      // Mobile Drawer Controller
      var drawer = document.getElementById("mobile-drawer");
      var openBtn = document.getElementById("mobile-drawer-open");
      var closeBtn = document.getElementById("mobile-drawer-close");
      var backdrop = document.getElementById("mobile-drawer-backdrop");

      function openDrawer() {
        if (!drawer) return;
        drawer.classList.remove("hidden");
        document.body.style.overflow = "hidden";
        if (openBtn) openBtn.setAttribute("aria-expanded", "true");
      }

      function closeDrawer() {
        if (!drawer) return;
        drawer.classList.add("hidden");
        document.body.style.overflow = "";
        if (openBtn) openBtn.setAttribute("aria-expanded", "false");
      }

      if (openBtn) openBtn.addEventListener("click", openDrawer);
      if (closeBtn) closeBtn.addEventListener("click", closeDrawer);
      if (backdrop) backdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && drawer && !drawer.classList.contains("hidden")) {
          closeDrawer();
        }
      });

      // Micro Motion: Viewport Intersection Observer (Fail-safe)
      var reveals = document.querySelectorAll(".reveal");
      if (reveals.length > 0) {
        document.documentElement.classList.add("js-ready");
        if (!("IntersectionObserver" in window)) {
          reveals.forEach(function (el) { el.classList.add("in-view"); });
        } else {
          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("in-view");
                observer.unobserve(entry.target);
              }
            });
          }, { rootMargin: "0px 0px 100px 0px", threshold: 0.01 });
          reveals.forEach(function (el) { observer.observe(el); });

          // Immediate check for elements in viewport on load
          reveals.forEach(function (el) {
            var rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight && rect.bottom > 0) {
              el.classList.add("in-view");
            }
          });
        }

        // Global safety fallback: force reveal everything after 600ms so nothing stays hidden
        setTimeout(function () {
          document.querySelectorAll(".reveal:not(.in-view)").forEach(function (el) {
            el.classList.add("in-view");
          });
        }, 600);
      }
    });
  </script>
</body>
</html>
