<html lang="en" class="scroll-smooth dark">
<head>

  <meta property="og:title" content="{% block og_title %}{{ COMPANY.name }} — {{ COMPANY.legal_name }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ COMPANY.tagline }} IT staffing, recruitment, talent acquisition and training.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ COMPANY.url }}{% static 'images/og-gctt-v2.jpg' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ COMPANY.url }}{% static 'images/og-gctt-v2.jpg' %}">
  <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <link rel="icon" type="image/svg+xml" href="{% static 'images/logo-icon.svg' %}">
  <link rel="alternate icon" href="{% static 'images/logo-small.webp' %}">

  <!-- Typography: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/output.css' %}?v=20261117-04">
  <!-- Immediate Theme Detector (prevents theme flicker) -->
  <script>
    (function () {
      var savedTheme = localStorage.getItem("gctt-theme");
      if (savedTheme === "light") {
        document.documentElement.classList.add("light");
        document.documentElement.classList.remove("dark");
      } else {
        document.documentElement.classList.add("dark");
        document.documentElement.classList.remove("light");
      }
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ COMPANY.name|escapejs }}",
    "legalName": "{{ COMPANY.legal_name|escapejs }}",
    "url": "{{ COMPANY.url|escapejs }}",
    "email": "{{ COMPANY.email|escapejs }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "2612 Laramie St",
      "addressLocality": "Irving",
      "addressRegion": "TX",
      "postalCode": "75062",
      "addressCountry": "US"
    }
  }
  </script>
</head>
<body class="min-h-screen bg-[#000000] text-[#ebebeb] font-sans antialiased p-0 sm:p-3 lg:p-4 selection:bg-[#ccff00] selection:text-black">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-[#ccff00] focus:px-4 focus:py-2 focus:font-bold focus:text-black">Skip to content</a>

  <!-- Floating Shell Container (Ultimate Hardware Shell Architecture) -->
  <div class="relative mx-auto max-w-[1600px] overflow-hidden rounded-none sm:rounded-[2.5rem] border border-white/10 bg-[#0c0c0c] shadow-2xl">
    <!-- Atmospheric 60x60px Grid Pattern & Glowing Spheres -->
    <div class="pointer-events-none absolute inset-0 bg-cyber-grid opacity-20"></div>
    <div class="pointer-events-none absolute -top-40 left-1/4 h-[500px] w-[500px] rounded-full bg-[#ccff00]/10 blur-[140px]"></div>
    <div class="pointer-events-none absolute top-1/2 -right-20 h-[600px] w-[600px] rounded-full bg-[#10b981]/10 blur-[160px]"></div>
    <div class="pointer-events-none absolute bottom-1/4 -left-20 h-[450px] w-[450px] rounded-full bg-[#ccff00]/8 blur-[150px]"></div>

    {% include "partials/_header.html" %}
    {% include "partials/_messages.html" %}
    
    <main id="main" class="relative z-10">
      {% block content %}{% endblock %}
    </main>
    
    {% include "partials/_footer.html" %}
  </div>

  <!-- Floating WhatsApp Quick Connect Button -->
  <a
    href="https://api.whatsapp.com/send?phone=19725550199&text=Hello%20GCTT%20Team%2C%20I%20would%20like%20to%20inquire%20about%20your%20IT%20staffing%20and%20training%20services."
    target="_blank"
    rel="noopener noreferrer"
    class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-[#ccff00] text-black shadow-lg shadow-[#ccff00]/30 hover:scale-110 active:scale-95 transition-all duration-300 border border-black/20"
    aria-label="Direct WhatsApp message to GCTT Texas Headquarters"
    title="Chat with GCTT Headquarters"
  >
    <svg class="h-7 w-7 fill-current" viewBox="0 0 24 24">
      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
    </svg>
  </a>

  <!-- Mobile Drawer & Micro Motion Controllers -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Theme Mode Controller
      function updateThemeUI() {
        var isDark = document.documentElement.classList.contains("dark");
        document.querySelectorAll(".theme-sun-icon").forEach(function (icon) {
          if (isDark) icon.classList.remove("hidden"); else icon.classList.add("hidden");
        });
        document.querySelectorAll(".theme-moon-icon").forEach(function (icon) {
          if (isDark) icon.classList.add("hidden"); else icon.classList.remove("hidden");
        });
      }

      function toggleTheme() {
        if (document.documentElement.classList.contains("dark")) {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
          localStorage.setItem("gctt-theme", "light");
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
          localStorage.setItem("gctt-theme", "dark");
        }
        updateThemeUI();
      }

      document.querySelectorAll(".theme-toggle-btn").forEach(function (btn) {
        btn.addEventListener("click", toggleTheme);
      });
      updateThemeUI();

      // Mobile Drawer Controller
      var drawer = document.getElementById("mobile-drawer");
      var openBtn = document.getElementById("mobile-drawer-open");
      var closeBtn = document.getElementById("mobile-drawer-close");
      var backdrop = document.getElementById("mobile-drawer-backdrop");

      function openDrawer() {
        if (!drawer) return;
        drawer.classList.remove("hidden");
        document.body.style.overflow = "hidden";
        if (openBtn) openBtn.setAttribute("aria-expanded", "true");
      }

      function closeDrawer() {
        if (!drawer) return;
        drawer.classList.add("hidden");
        document.body.style.overflow = "";
        if (openBtn) openBtn.setAttribute("aria-expanded", "false");
      }

      if (openBtn) openBtn.addEventListener("click", openDrawer);
      if (closeBtn) closeBtn.addEventListener("click", closeDrawer);
      if (backdrop) backdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && drawer && !drawer.classList.contains("hidden")) {
          closeDrawer();
        }
      });

      // Micro Motion Viewport Intersection Observer
      var reveals = document.querySelectorAll(".reveal");
      if (reveals.length > 0) {
        document.documentElement.classList.add("js-ready");
        if (!("IntersectionObserver" in window)) {
          reveals.forEach(function (el) { el.classList.add("in-view"); });
        } else {
          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("in-view");
                observer.unobserve(entry.target);
              }
            });
          }, { rootMargin: "0px 0px 80px 0px", threshold: 0.01 });
          reveals.forEach(function (el) { observer.observe(el); });

          reveals.forEach(function (el) {
            var rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight && rect.bottom > 0) {
              el.classList.add("in-view");
            }
          });
        }

        setTimeout(function () {
          document.querySelectorAll(".reveal:not(.in-view)").forEach(function (el) {
            el.classList.add("in-view");
          });
        }, 500);
      }
    });
  </script>
</body>
</html>
